<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولّد الفيديو السينمائي الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
        .glass-hover:hover {
            background: rgba(51, 65, 85, 0.7);
            border-color: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
        }
        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 9999px;
            transition: width 0.5s ease;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #e2e8f0;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show {
            opacity: 1;
        }
        .remove-image-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .remove-image-btn:hover {
            background: #ef4444;
        }
        .preview-container {
            position: relative;
            max-width: 100%;
            margin-top: 0.5rem;
        }
        .preview-container img {
            max-height: 140px;
            max-width: 100%;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-200">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold bg-gradient-to-l from-indigo-400 to-purple-500 bg-clip-text text-transparent">
                <i class="fas fa-film ml-2"></i> مولّد الفيديو السينمائي الذكي
            </h1>
            <button class="btn-secondary" onclick="openSettings()">
                <i class="fas fa-cog ml-2"></i> الإعدادات
            </button>
        </header>

        <!-- الفكرة الأساسية -->
        <section class="glass p-6 mb-6">
            <h2 class="text-xl font-semibold mb-3"><i class="fas fa-lightbulb ml-2 text-yellow-400"></i> الفكرة الأساسية</h2>
            <textarea id="seedPrompt" rows="3" placeholder="اكتب فكرة قصتك هنا... مثال: رائد فضاء يكتشف كوكباً جديداً مليئاً بالحياة الغريبة" class="w-full bg-slate-800/50 border border-slate-600/50 rounded-xl p-3 text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            <button class="btn-primary mt-4" onclick="generateStories()">
                <i class="fas fa-wand-magic-sparkles ml-2"></i> اقترح سيناريوهات احترافية
            </button>
            <div id="storiesContainer" class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </section>

        <!-- الصور المرجعية -->
        <section class="glass p-6 mb-6">
            <h2 class="text-xl font-semibold mb-3"><i class="fas fa-images ml-2 text-blue-400"></i> صور التحكم (First & Last Frame)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- First Frame -->
                <div>
                    <label class="block mb-2 font-medium">صورة البداية (First Frame)</label>
                    <div id="firstFrameDropZone" class="drop-zone">
                        <div id="firstFramePlaceholder">
                            <i class="fas fa-cloud-upload-alt text-3xl text-slate-400 mb-2"></i>
                            <p class="text-sm text-slate-400">اسحب وأفلت الصورة هنا أو انقر للاختيار</p>
                        </div>
                        <div id="firstFramePreviewContainer" class="preview-container hidden">
                            <img id="firstFramePreview" class="rounded-lg" alt="First Frame Preview" />
                            <button class="remove-image-btn" onclick="removeImage('first')" type="button" title="إزالة الصورة">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                    <input type="file" id="firstFrameInput" accept="image/*" class="hidden" />
                </div>
                <!-- Last Frame -->
                <div>
                    <label class="block mb-2 font-medium">صورة النهاية (Last Frame)</label>
                    <div id="lastFrameDropZone" class="drop-zone">
                        <div id="lastFramePlaceholder">
                            <i class="fas fa-cloud-upload-alt text-3xl text-slate-400 mb-2"></i>
                            <p class="text-sm text-slate-400">اسحب وأفلت الصورة هنا أو انقر للاختيار</p>
                        </div>
                        <div id="lastFramePreviewContainer" class="preview-container hidden">
                            <img id="lastFramePreview" class="rounded-lg" alt="Last Frame Preview" />
                            <button class="remove-image-btn" onclick="removeImage('last')" type="button" title="إزالة الصورة">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                    <input type="file" id="lastFrameInput" accept="image/*" class="hidden" />
                </div>
            </div>
        </section>

        <!-- المدة الزمنية -->
        <section class="glass p-6 mb-6">
            <h2 class="text-xl font-semibold mb-3"><i class="fas fa-clock ml-2 text-green-400"></i> مدة الفيديو</h2>
            <div class="flex flex-wrap gap-3">
                <button class="btn-secondary duration-btn" onclick="setDuration(5)">5 ثوانٍ</button>
                <button class="btn-secondary duration-btn" onclick="setDuration(10)">10 ثوانٍ</button>
                <button class="btn-secondary duration-btn" onclick="setDuration(15)">15 ثانية</button>
                <button class="btn-secondary duration-btn" onclick="setDuration(30)">30 ثانية</button>
                <button class="btn-secondary duration-btn" onclick="setDuration(60)">60 ثانية</button>
            </div>
            <p id="durationInfo" class="mt-2 text-sm text-slate-400">المدة المختارة: <span class="font-bold text-white">5 ثوانٍ</span></p>
        </section>

        <!-- زر التوليد -->
        <div class="flex justify-center mb-6">
            <button id="generateBtn" class="btn-primary text-lg px-8 py-3" onclick="generateVideo()">
                <i class="fas fa-play-circle ml-2"></i> توليد الفيديو
            </button>
        </div>

        <!-- منطقة التقدم والنتيجة -->
        <section class="glass p-6 mb-6 hidden" id="progressSection">
            <h2 class="text-xl font-semibold mb-3"><i class="fas fa-chart-line ml-2 text-purple-400"></i> التقدم</h2>
            <div id="progressContainer" class="space-y-3"></div>
        </section>

        <section class="glass p-6 hidden" id="resultSection">
            <h2 class="text-xl font-semibold mb-3"><i class="fas fa-video ml-2 text-red-400"></i> الفيديو الناتج</h2>
            <div class="aspect-video bg-black rounded-xl overflow-hidden">
                <video id="resultVideo" controls class="w-full h-full"></video>
            </div>
            <div class="flex justify-center mt-4">
                <a id="downloadLink" class="btn-secondary" download>
                    <i class="fas fa-download ml-2"></i> تحميل الفيديو
                </a>
            </div>
        </section>

        <!-- نافذة الإعدادات -->
        <div id="settingsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden">
            <div class="glass p-6 w-full max-w-md mx-4">
                <h3 class="text-xl font-bold mb-4">الإعدادات</h3>
                <div class="mb-4">
                    <label class="block mb-2">مفتاح Groq API (مجاني)</label>
                    <input type="password" id="groqApiKey" class="w-full bg-slate-800/50 border border-slate-600/50 rounded-xl p-3 text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="gsk_..." />
                </div>
                <div class="mb-4">
                    <label class="block mb-2">مفتاح Google Gemini API (مجاني)</label>
                    <input type="password" id="geminiApiKey" class="w-full bg-slate-800/50 border border-slate-600/50 rounded-xl p-3 text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="AIza..." />
                </div>
                <div class="flex justify-end gap-2">
                    <button class="btn-secondary" onclick="closeSettings()">إلغاء</button>
                    <button class="btn-primary" onclick="saveSettings()">حفظ</button>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div id="toast" class="toast"></div>
    </div>

    <script>
        // ---------- المتغيرات العامة ----------
        let selectedDuration = 5;
        let firstFrameBase64 = null;
        let lastFrameBase64 = null;
        let currentVideoUrl = null;
        let groqKey = '';
        let geminiKey = '';
        let selectedStory = null;

        // ---------- التهيئة ----------
        document.addEventListener('DOMContentLoaded', () => {
            groqKey = localStorage.getItem('groqKey') || '';
            geminiKey = localStorage.getItem('geminiKey') || '';
            document.getElementById('groqApiKey').value = groqKey;
            document.getElementById('geminiApiKey').value = geminiKey;

            setupDropZone('first');
            setupDropZone('last');
            setDuration(5);
        });

        // ---------- دوال السحب والإفلات وإدارة الملفات ----------
        function setupDropZone(type) {
            const dropZone = document.getElementById(type === 'first' ? 'firstFrameDropZone' : 'lastFrameDropZone');
            const input = document.getElementById(type === 'first' ? 'firstFrameInput' : 'lastFrameInput');
            const placeholder = document.getElementById(type === 'first' ? 'firstFramePlaceholder' : 'lastFramePlaceholder');
            const previewContainer = document.getElementById(type === 'first' ? 'firstFramePreviewContainer' : 'lastFramePreviewContainer');
            const previewImg = document.getElementById(type === 'first' ? 'firstFramePreview' : 'lastFramePreview');

            dropZone.addEventListener('click', (e) => {
                if (e.target.closest('.remove-image-btn')) return;
                input.click();
            });

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    handleFile(file, type, placeholder, previewContainer, previewImg);
                } else {
                    showToast('الرجاء اختيار ملف صورة صالح');
                }
            });

            input.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    handleFile(file, type, placeholder, previewContainer, previewImg);
                }
                input.value = '';
            });
        }

        function handleFile(file, type, placeholder, previewContainer, previewImg) {
            if (!file.type.startsWith('image/')) {
                showToast('الرجاء اختيار ملف صورة صالح');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const base64String = e.target.result.split(',')[1];
                if (type === 'first') {
                    firstFrameBase64 = base64String;
                } else {
                    lastFrameBase64 = base64String;
                }

                previewImg.src = e.target.result;
                placeholder.classList.add('hidden');
                previewContainer.classList.remove('hidden');
                showToast('تم رفع الصورة بنجاح');
            };
            reader.onerror = () => {
                showToast('فشل قراءة الملف');
            };
            reader.readAsDataURL(file);
        }

        function removeImage(type) {
            const placeholder = document.getElementById(type === 'first' ? 'firstFramePlaceholder' : 'lastFramePlaceholder');
            const previewContainer = document.getElementById(type === 'first' ? 'firstFramePreviewContainer' : 'lastFramePreviewContainer');
            const previewImg = document.getElementById(type === 'first' ? 'firstFramePreview' : 'lastFramePreview');

            previewContainer.classList.add('hidden');
            placeholder.classList.remove('hidden');
            previewImg.src = '';

            if (type === 'first') {
                firstFrameBase64 = null;
            } else {
                lastFrameBase64 = null;
            }
            showToast('تمت إزالة الصورة');
        }

        // ---------- إعدادات ----------
        function openSettings() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }
        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }
        function saveSettings() {
            groqKey = document.getElementById('groqApiKey').value.trim();
            geminiKey = document.getElementById('geminiApiKey').value.trim();
            localStorage.setItem('groqKey', groqKey);
            localStorage.setItem('geminiKey', geminiKey);
            closeSettings();
            showToast('تم حفظ الإعدادات');
        }

        // ---------- عرض التوست ----------
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ---------- اختيار المدة ----------
        function setDuration(seconds) {
            selectedDuration = seconds;
            document.getElementById('durationInfo').innerHTML = `المدة المختارة: <span class="font-bold text-white">${seconds} ثوانٍ</span>`;
            document.querySelectorAll('.duration-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-500/30', 'border-indigo-400');
                if (btn.textContent.includes(seconds + ' ث')) {
                    btn.classList.add('bg-indigo-500/30', 'border-indigo-400');
                }
            });
        }

        // ---------- توليد القصص ----------
        async function generateStories() {
            const prompt = document.getElementById('seedPrompt').value.trim();
            if (!prompt) {
                showToast('الرجاء إدخال فكرة القصة أولاً');
                return;
            }

            const storiesContainer = document.getElementById('storiesContainer');
            storiesContainer.innerHTML = '<div class="col-span-3 text-center p-4"><i class="fas fa-spinner fa-spin text-2xl"></i></div>';

            try {
                let stories = [];
                if (groqKey) {
                    stories = await generateWithGroq(prompt);
                } else if (geminiKey) {
                    stories = await generateWithGemini(prompt);
                } else {
                    stories = [
                        {
                            title: "المكتشف الأخير",
                            description: "في عام 2150، يكتشف رائد فضاء كوكباً يحتوي على حياة ذكية لكنها على وشك الانقراض بسبب نجم يحتضر، فيحاول إنقاذهم بمساعدة ذكاء اصطناعي.",
                            scenes: ["الهبوط على الكوكب", "اكتشاف الحضارة", "التواصل مع السكان", "محاولة الإنقاذ"]
                        },
                        {
                            title: "الذاكرة المفقودة",
                            description: "امرأة تستيقظ في مختبر بلا ذاكرة، وتكتشف أنها استُنسخت لتحل محل شخصية مهمة، فتهرب بحثاً عن هويتها الحقيقية.",
                            scenes: ["الاستيقاظ في المختبر", "الهروب", "لقاء النسخة الأصلية", "اكتشاف الحقيقة"]
                        },
                        {
                            title: "آخر شجرة",
                            description: "في عالم صحراوي بعد نهاية العالم، يجد طفل شجرة صغيرة ويعتني بها، لتصبح الأمل الأخير للبشرية.",
                            scenes: ["اكتشاف الشجرة", "حمايتها من اللصوص", "نموها", "انتشار الحياة"]
                        }
                    ];
                    showToast('تم استخدام قصص تجريبية لأنك لم تدخل مفتاح API');
                }

                storiesContainer.innerHTML = '';
                stories.forEach((story, index) => {
                    const card = document.createElement('div');
                    card.className = 'glass glass-hover p-4 cursor-pointer';
                    card.innerHTML = `
                        <h3 class="font-bold text-lg mb-2">${story.title}</h3>
                        <p class="text-sm text-slate-300 mb-2">${story.description}</p>
                        <div class="text-xs text-slate-400">
                            <i class="fas fa-film ml-1"></i> مشاهد: ${story.scenes.length}
                        </div>
                    `;
                    card.addEventListener('click', () => selectStory(story));
                    storiesContainer.appendChild(card);
                });
            } catch (error) {
                storiesContainer.innerHTML = '';
                showToast('فشل توليد القصص: ' + error.message);
            }
        }

        async function generateWithGroq(prompt) {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${groqKey}`
                },
                body: JSON.stringify({
                    model: 'llama3-8b-8192',
                    messages: [
                        { role: 'system', content: 'أنت كاتب سيناريو محترف. اقترح 3 قصص سينمائية كاملة بناءً على الفكرة المعطاة. أعد النتيجة بصيغة JSON تحتوي على مصفوفة من الكائنات، كل كائن يحتوي على title, description, scenes (مصفوفة نصوص).' },
                        { role: 'user', content: prompt }
                    ],
                    temperature: 0.7,
                    response_format: { type: 'json_object' }
                })
            });
            if (!response.ok) throw new Error('خطأ في Groq API');
            const data = await response.json();
            const content = data.choices[0].message.content;
            const parsed = JSON.parse(content);
            return parsed.stories || [];
        }

        async function generateWithGemini(prompt) {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${geminiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `أنت كاتب سيناريو محترف. اقترح 3 قصص سينمائية كاملة بناءً على الفكرة: "${prompt}". أعد النتيجة بصيغة JSON تحتوي على مصفوفة stories، كل عنصر يحتوي على title, description, scenes (مصفوفة نصوص).`
                        }]
                    }]
                })
            });
            if (!response.ok) throw new Error('خطأ في Gemini API');
            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text;
            const jsonMatch = text.match(/\{[\s\S]*\}/);
            if (!jsonMatch) throw new Error('صيغة غير صحيحة من Gemini');
            const parsed = JSON.parse(jsonMatch[0]);
            return parsed.stories || [];
        }

        function selectStory(story) {
            selectedStory = story;
            showToast(`تم اختيار قصة: ${story.title}`);
        }

        // ---------- تحويل Base64 إلى Blob ----------
        function dataURItoBlob(dataURI) {
            // يفترض أن dataURI تأتي بصيغة "data:image/...;base64,XXXX"
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }

        // ---------- توليد الفيديو ----------
        async function generateVideo() {
            const prompt = selectedStory ? selectedStory.description : document.getElementById('seedPrompt').value.trim();
            if (!prompt) {
                showToast('الرجاء اختيار قصة أو إدخال فكرة');
                return;
            }

            if (!groqKey && !geminiKey) {
                showToast('تحذير: لا يوجد مفتاح LLM، سيتم استخدام النص الأساسي فقط');
            }

            // تقسيم المدة إلى مشاهد 5 ثوانٍ
            const numScenes = Math.ceil(selectedDuration / 5);
            const scenes = [];
            for (let i = 0; i < numScenes; i++) {
                scenes.push({
                    index: i,
                    duration: Math.min(5, selectedDuration - i * 5),
                    prompt: prompt + (i > 0 ? ` (مشهد ${i+1} مع استمرار الأحداث)` : '')
                });
            }

            document.getElementById('progressSection').classList.remove('hidden');
            document.getElementById('resultSection').classList.add('hidden');
            const progressContainer = document.getElementById('progressContainer');
            progressContainer.innerHTML = '';

            const videoUrls = [];
            for (const scene of scenes) {
                const sceneDiv = document.createElement('div');
                sceneDiv.className = 'mb-3';
                sceneDiv.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span>مشهد ${scene.index + 1} / ${scenes.length}</span>
                        <span class="text-sm text-slate-400">${scene.duration} ث</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width:0%"></div>
                    </div>
                    <div class="text-xs text-slate-400 mt-1"></div>
                `;
                progressContainer.appendChild(sceneDiv);

                const statusEl = sceneDiv.querySelector('.text-xs');
                try {
                    statusEl.textContent = 'جارٍ التوليد...';
                    const url = await generateSceneVideo(scene, firstFrameBase64, lastFrameBase64, (progress) => {
                        const fill = sceneDiv.querySelector('.progress-fill');
                        if (fill) fill.style.width = progress + '%';
                    });
                    videoUrls.push(url);
                    statusEl.textContent = 'تم';
                    statusEl.className = 'text-xs text-green-400 mt-1';
                } catch (error) {
                    statusEl.textContent = `فشل: ${error.message}`;
                    statusEl.className = 'text-xs text-red-400 mt-1';
                    console.error('Scene generation error:', error);
                    continue;
                }
            }

            if (videoUrls.length > 0) {
                currentVideoUrl = videoUrls[0];
                document.getElementById('resultVideo').src = currentVideoUrl;
                document.getElementById('downloadLink').href = currentVideoUrl;
                document.getElementById('resultSection').classList.remove('hidden');
                showToast('تم توليد الفيديو بنجاح');
            } else {
                showToast('فشل توليد جميع المشاهد');
            }
        }

        async function generateSceneVideo(scene, firstFrameBase64, lastFrameBase64, onProgress) {
            try {
                let result;
                if (firstFrameBase64) {
                    // صورة إلى فيديو
                    const imageBlob = dataURItoBlob('data:image/png;base64,' + firstFrameBase64);
                    const client = await Client.connect("fffiloni/LTX-Video");
                    result = await client.predict("/predict", {
                        image: imageBlob,
                        prompt: scene.prompt,
                        negative_prompt: "",
                        duration: scene.duration,
                        guidance_scale: 3.0,
                        seed: 0,
                    });
                } else {
                    // نص إلى فيديو
                    const client = await Client.connect("Wan-AI/Wan2.1");
                    result = await client.predict("/predict", {
                        prompt: scene.prompt,
                        negative_prompt: "",
                        duration: scene.duration,
                        seed: 0,
                    });
                }

                let videoUrl = null;
                if (Array.isArray(result.data) && result.data.length > 0) {
                    const firstItem = result.data[0];
                    if (typeof firstItem === 'string') {
                        videoUrl = firstItem;
                    } else if (firstItem && firstItem.url) {
                        videoUrl = firstItem.url;
                    } else if (firstItem && firstItem.path) {
                        videoUrl = firstItem.path;
                    }
                }

                if (!videoUrl) throw new Error('لم يتم العثور على رابط الفيديو في الاستجابة');
                onProgress(100);
                return videoUrl;
            } catch (error) {
                console.error('Gradio Error:', error);
                throw new Error('فشل الاتصال بخادم Hugging Face: ' + (error.message || 'خطأ غير معروف'));
            }
        }
    </script>
